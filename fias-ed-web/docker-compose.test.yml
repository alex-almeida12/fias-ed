name: fias-ed-web-test
services:
  db-test:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: test-superuser
      POSTGRES_DB: fias_ed_web_test
      FIAS_ED_MIGRATOR_PASSWORD: test-migrator
      FIAS_ED_APP_PASSWORD: test-app
    volumes:
      - ./deploy/db-init:/docker-entrypoint-initdb.d:ro
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d fias_ed_web_test"]
      interval: 2s
      timeout: 3s
      retries: 30
  api-test:
    build:
      context: ..
      dockerfile: fias-ed-web/backend/Dockerfile
      target: dev
    environment:
      DATABASE_URL: postgresql+psycopg://fias_ed_app:test-app@db-test:5432/fias_ed_web_test
      MIGRATOR_DATABASE_URL: postgresql+psycopg://fias_ed_migrator:test-migrator@db-test:5432/fias_ed_web_test
      AUDIO_STORE: /tmp/audio
      # /models fica vazio aqui de propósito: a suíte padrão tem de rodar sem
      # peso nenhum. Os testes `lento` recebem o volume na linha de comando
      # (veja "Modelos" no README), e não por padrão.
      MODELS_DIR: /models
      ASR_SIZE: ${ASR_SIZE:-small}
      # Os testes `lento` carregam os modelos reais exatamente como o produto:
      # offline. Se um deles só passar com rede, o que ele prova não vale nada.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - ./backend:/app
      - ./scripts:/app/scripts:ro
    depends_on:
      db-test:
        condition: service_healthy
    command: ["pytest", "-q"]
