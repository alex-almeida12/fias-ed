[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fias-ed-web-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  # Form/File (importação do relatório QTI, Task 5): o parsing de multipart/form-data do
  # Starlette exige esta lib mesmo quando nenhum código a importa diretamente.
  "python-multipart>=0.0.9,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "spacy>=3.8,<3.9",
  # Modelo de NER de português (MIT + CC BY-SA 4.0), instalado como wheel local do release
  # oficial do spaCy: baixado uma vez no build da imagem, nunca em tempo de execução.
  "pt_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
  # Modelos reais (Task 14). O alvo é CPU: o Dockerfile instala torch/torchaudio do
  # índice de wheels CPU do PyTorch antes deste pip, senão vem o wheel com CUDA e a
  # imagem cresce alguns gigabytes sem serventia nenhuma aqui.
  # <2.9: a partir do torchaudio 2.9 o `torchaudio.AudioMetaData` sumiu e o
  # pyannote.audio 3.x quebra na importação. Teto de versão, não capricho.
  "torch>=2.2,<2.9",
  "torchaudio>=2.2,<2.9",
  "transformers>=4.44,<5",
  "faster-whisper>=1.0,<2",
  "pyannote.audio>=3.3,<4",
  "huggingface-hub>=0.24,<1",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "bandit>=1.7.9", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["lento: usa modelo real; fora da suíte padrão"]
# -m 'not lento' mantém a suíte padrão rodando sem peso de modelo e sem GPU; o
# -p no:cacheprovider é anterior (imagem com /app somente leitura) e continua valendo.
addopts = "-p no:cacheprovider -m 'not lento'"
