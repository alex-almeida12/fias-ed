[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "fias-ed-web-api"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "pydantic-settings>=2.4,<3",
  "sqlalchemy>=2.0.30,<2.1",
  "psycopg[binary]>=3.2,<4",
  "alembic>=1.13,<2",
  "argon2-cffi>=23.1,<26",
  "spacy>=3.8,<3.9",
  # Modelo de NER de português (MIT + CC BY-SA 4.0), instalado como wheel local do release
  # oficial do spaCy: baixado uma vez no build da imagem, nunca em tempo de execução.
  "pt_core_news_sm @ https://github.com/explosion/spacy-models/releases/download/pt_core_news_sm-3.8.0/pt_core_news_sm-3.8.0-py3-none-any.whl",
]

[project.optional-dependencies]
dev = ["pytest>=8", "httpx>=0.27", "bandit>=1.7.9", "pip-audit>=2.7"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider"
