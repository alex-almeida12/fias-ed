# Projeto "fias-ed-web" (não "fias-ed": esse nome já é usado por outro projeto nesta máquina).
name: fias-ed-web

x-hardening: &hardening
  restart: unless-stopped
  security_opt: ["no-new-privileges:true"]
  cap_drop: ["ALL"]

x-api-image: &api-image
  build:
    context: ..
    dockerfile: fias-ed-web/backend/Dockerfile
    target: prod
  image: fias-ed-web-api:local

services:
  db:
    <<: *hardening
    build:
      context: ./deploy
      dockerfile: db.Dockerfile
    user: "70:70"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?defina POSTGRES_PASSWORD no .env}
      POSTGRES_DB: fias_ed_web
      FIAS_ED_MIGRATOR_PASSWORD: ${FIAS_ED_MIGRATOR_PASSWORD:?defina no .env}
      FIAS_ED_APP_PASSWORD: ${FIAS_ED_APP_PASSWORD:?defina no .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks: [fias_net]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U postgres -d fias_ed_web"]
      interval: 5s
      timeout: 3s
      retries: 20

  # Serviço de execução única (roda o Alembic e sai): isento de healthcheck.
  migrate:
    <<: *api-image
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"
    command: ["alembic", "upgrade", "head"]
    environment:
      MIGRATOR_DATABASE_URL: postgresql+psycopg://fias_ed_migrator:${FIAS_ED_MIGRATOR_PASSWORD}@db:5432/fias_ed_web
    networks: [fias_net]
    depends_on:
      db:
        condition: service_healthy

  api:
    <<: [*hardening, *api-image]
    environment: &api-env
      DATABASE_URL: postgresql+psycopg://fias_ed_app:${FIAS_ED_APP_PASSWORD}@db:5432/fias_ed_web
      DEVICE_ID: ${DEVICE_ID:-fias-ed-web}
      MAX_UPLOAD_BYTES: ${MAX_UPLOAD_BYTES:-1610612736}
      MIN_AUDIO_SECONDS: ${MIN_AUDIO_SECONDS:-60}
      MAX_AUDIO_SECONDS: ${MAX_AUDIO_SECONDS:-9000}
      MODELS_DIR: /models
      ASR_SIZE: ${ASR_SIZE:-small}
      # Em execução nada sai para a rede atrás de peso. As três classes de modelo
      # já carregam com local_files_only; isto aqui é a segunda tranca, para o
      # caso de uma dependência resolver consultar o Hub por conta própria.
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
    volumes:
      - audio_store:/data/audio
      - models:/models:ro
    networks: [fias_net, edge]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 10

  worker:
    <<: [*hardening, *api-image]
    command: ["python", "-m", "app.jobs.worker"]
    environment: *api-env
    volumes:
      - audio_store:/data/audio
      - models:/models:ro
    networks: [fias_net]
    depends_on:
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "python", "-c", "import os, sys, time; sys.exit(0 if time.time() - os.path.getmtime('/tmp/fias-ed-worker-heartbeat') < 60 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  # Execução única, à mão, na instalação (veja "Modelos" no README). É o único
  # serviço que sai para a rede atrás de peso — daí ficar atrás de um profile:
  # `docker compose up` não o levanta.
  setup-models:
    <<: *api-image
    security_opt: ["no-new-privileges:true"]
    cap_drop: ["ALL"]
    restart: "no"
    profiles: ["setup"]
    command: ["python", "/app/scripts/setup_models.py"]
    environment:
      FIAS_ED_MODELS_DIR: /models
      FIAS_ED_EXPERIMENTS_DIR: /experimentos
      FIAS_ED_ASR_SIZE: ${ASR_SIZE:-small}
      # Sem `:?` de propósito: o compose interpola o arquivo inteiro mesmo para
      # quem só vai subir o produto, e um `:?` aqui quebraria o `up` de todo
      # mundo que não tem token. Quem valida é o próprio script.
      HUGGINGFACE_TOKEN: ${HUGGINGFACE_TOKEN:-}
    volumes:
      - models:/models
      # Somente leitura: os pesos do BERTimbau saem daqui e nada volta para lá.
      - ${FIAS_ED_EXPERIMENTS_DIR:-./deploy}:/experimentos:ro
    networks: [edge]

  web:
    <<: *hardening
    build:
      context: ..
      dockerfile: fias-ed-web/deploy/web.Dockerfile
    image: fias-ed-web-web:local
    ports:
      - "127.0.0.1:8080:8080"
    networks: [edge]
    depends_on:
      api:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 3s
      retries: 10

networks:
  fias_net:
    internal: true
  edge: {}

volumes:
  pgdata:
  audio_store:
  models:
