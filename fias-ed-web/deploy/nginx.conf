server {
    listen 8080;
    server_name _;
    server_tokens off;
    # Fixo em 1536m (= MAX_UPLOAD_BYTES padrão, 1,5 GB). Se mudar MAX_UPLOAD_BYTES no .env, mude aqui também.
    client_max_body_size 1536m;
    # Acima do limite o nginx responde antes da API; devolve o mesmo JSON de erro da API
    # (AUDIO_TOO_LARGE). Se mudar o limite, mude também o texto em @too_large.
    error_page 413 @too_large;
    root /usr/share/nginx/html;

    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' data:; font-src 'self'; media-src 'self'; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'self'; frame-ancestors 'none'" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "no-referrer" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;
    add_header X-Frame-Options "DENY" always;

    location /api/ {
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # Sem buffer na resposta: a reprodução do áudio (até 1,5 GB, com Range) passa direto,
        # sem ser copiada para arquivos temporários do nginx. As respostas JSON são pequenas.
        proxy_buffering off;
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /publico/ {
        # §7 item 1 da spec (docs/superpowers/specs/2026-09-24-fias-ed-web-w3-qti-mtss-design.md):
        # "Nenhuma identidade de respondente é persistida. Sem nome, sem matrícula,
        # sem endereço de rede, sem identificador de dispositivo." O log de acesso
        # padrão do nginx grava o token do link (na URL) em claro e o IP de quem
        # respondeu, num arquivo no disco do host, sem rotação — um terceiro lugar
        # além dos dois que o docstring de app/qti/links.py promete para o segredo.
        # Achado da verificação final da fatia (2026-09-26). Quem for "melhorar a
        # observabilidade" desta rota precisa antes resolver isso (mascarar token e
        # IP no formato do log), não só apagar esta linha. A aplicação já registra
        # o molde da rota (/publico/qti/{token}, sem o valor) e nenhum IP — o custo
        # aceito aqui é só o diagnóstico de problema pontual do estudante.
        access_log off;
        proxy_pass http://api:8000;
        proxy_http_version 1.1;
        proxy_request_buffering off;
        # Único desvio do /api/: a única porta sem autenticação do sistema não tem por que
        # aceitar corpo grande — 32k basta para as 24 respostas do questionário (inteiros de
        # 1 a 5, algumas centenas de bytes). O limite de 1,5 GB é para o áudio da aula, numa
        # rota autenticada.
        client_max_body_size 32k;
        # proxy_buffering no padrão (ligado), ao contrário do /api/: o `off` de lá existe para
        # a reprodução de áudio com Range; aqui as respostas são JSON pequeno.
        proxy_read_timeout 600s;
        proxy_send_timeout 600s;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location @too_large {
        default_type application/json;
        return 413 '{"error_code":"AUDIO_TOO_LARGE","message":"O arquivo passa de 1,5 GB. Tente exportar o áudio em MP3 ou M4A, que ocupam menos espaço."}';
    }

    location /assets/ {
        try_files $uri =404;
        expires 7d;
    }

    location / {
        try_files $uri /index.html;
    }
}
